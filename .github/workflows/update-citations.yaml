name: update-citations
run-name: update citations

on:
  # Weekly refresh, opened as a pull request for review.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-resolves every id in content/sources.yaml against arXiv, doi.org, and
      # PubMed, and rewrites content/citations.yaml. `--force` bypasses the local
      # cache so a scheduled run always sees current metadata.
      - name: Rebuild citations
        run: npm run citations -- --force

      - name: Open pull request with updated citations
        uses: peter-evans/create-pull-request@v6
        with:
          branch: citation-update
          title: Periodic citation update
          commit-message: Update citations
          add-paths: content/citations.yaml
          body: |
            Regenerated `content/citations.yaml` from `content/sources.yaml`.

            Bibliographic fields (title, authors, publisher, date, link) come from
            the registries; everything else is carried over from `sources.yaml`.
